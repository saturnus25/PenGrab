[package]
name = "pengrab"
version = "0.2.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"
